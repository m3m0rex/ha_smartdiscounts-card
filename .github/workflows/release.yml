name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: |
          pip install pytest
          python scripts/build.py --check
          python -m pytest -q tests
      - name: Version lesen
        id: v
        run: |
          VERSION=$(grep -oP 'const VERSION = "\K[^"]+' dist/ha_smartdiscounts-card.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Release anlegen
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease";; esac
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" dist/ha_smartdiscounts-card.js --target main --title "v$VERSION" --notes-file notes.md $PRE
